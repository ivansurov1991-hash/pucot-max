name: MAX publisher
'on':
  push:
    branches: [main]
    paths:
      - .github/workflows/max-publish.yml
      - PUCOT_MAX_GitHub_Actions.zip
      - .github/workflows/PUCOT_MAX_GitHub_Actions.zip
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
    - cron: '10 7 * * *'
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: pucot-max-publisher
  cancel-in-progress: false
jobs:
  max:
    if: github.ref == 'refs/heads/main' && github.repository == 'ivansurov1991-hash/pucot-max'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load verified publisher and photos
        run: |
          set -euo pipefail
          p="$RUNNER_TEMP/pucot-release"
          archive=PUCOT_MAX_GitHub_Actions.zip
          if [ ! -f "$archive" ]; then archive=".github/workflows/$archive"; fi
          unzip -q "$archive" 'publish.py' 'max-root.pem' 'ready/*.json' 'media/*.png' -d "$p"
          echo "fb26479fe8255767c02e2c5a9fc5ccc628db8e7c7e328e119d78983f0b3748fe  $p/publish.py" | sha256sum -c -
      - name: Verify channel_putsot and process the scheduled slot
        shell: python -I {0}
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          POST_CRON: ${{ github.event.schedule }}
        run: |
          import importlib.util
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path(os.environ["RUNNER_TEMP"]) / "pucot-release" / "publish.py"
          spec = importlib.util.spec_from_file_location("pucot_publisher", path)
          pub = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pub)
          pub.CHANNEL = -78120262818399

          def channel_link(url):
              parsed = urlsplit(url or "")
              parts = parsed.path.strip("/").split("/")
              return parsed.scheme == "https" and parsed.netloc.lower() == "max.ru" and parts[0].lower() == "channel_putsot"

          token = pub.secret("MAX_BOT_TOKEN")
          pub.verified_access(token)
          chat = pub.call(f"{pub.MAX}/chats/{pub.CHANNEL}", token)
          if chat.get("chat_id") != pub.CHANNEL or chat.get("type") != "channel":
              raise SystemExit("MAX did not confirm the numeric channel ID.")
          if not channel_link(chat.get("link")):
              messages = pub.call(f"{pub.MAX}/messages?chat_id={pub.CHANNEL}&count=100", token)["messages"]
              ref = f"https://max.ru/c/{pub.CHANNEL}/AaAz-UlyFJA"
              same_post = any(
                  m.get("recipient", {}).get("chat_id") == pub.CHANNEL and
                  (channel_link(m.get("url")) or (m.get("url") or "").rstrip("/") == ref)
                  for m in messages
              )
              if not same_post:
                  raise SystemExit("Could not match this channel to @channel_putsot. No post sent.")
          print(f"Verified @channel_putsot ({pub.CHANNEL}) and bot publication rights.", flush=True)
          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              auth = "Bearer " + pub.secret("GITHUB_TOKEN")
              run_id = int(os.environ["GITHUB_RUN_ID"])
              run = pub.call(f"{pub.GH}/actions/runs/{run_id}", auth)
              started = pub.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              slot = pub.slot_key(started, pub.datetime.now(pub.MSK), os.environ["POST_CRON"])
              pub.publish(slot, token, auth)
